; Xdebug for the dev target. Off by default: set XDEBUG_MODE=debug in .env and
; run `npm run up` to enable step debugging. The XDEBUG_MODE environment
; variable overrides xdebug.mode.
xdebug.mode = off
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log_level = 0
