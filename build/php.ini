; WhalePress PHP settings (all targets).
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
max_input_vars = 3000
expose_php = Off

; OPcache is enabled by the official image; size it for WordPress.
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
