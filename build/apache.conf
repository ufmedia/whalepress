# WhalePress Apache hardening (all targets).

ServerTokens Prod
ServerSignature Off

# Composer's vendor directory sits beside wp-content, mirroring the repository
# layout, so it must never be served.
<Directory /var/www/html/vendor>
    Require all denied
</Directory>

# Block dotfiles (.env, .git, etc.) should any end up in the web root.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
