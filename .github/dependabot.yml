version: 2
updates:
  # One PR for all npm updates (root tooling + theme), majors included.
  - package-ecosystem: npm
    directories: [/, /wp-content/themes/whalepress]
    schedule:
      interval: weekly
    labels: [dependencies, npm]
    groups:
      npm:
        patterns: ['*']

  # One PR for all Composer updates (plugins, Timber, etc.), majors included.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, php]
    groups:
      composer:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ['*']
