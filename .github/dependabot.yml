version: 2
updates:
  # One PR for npm minor/patch updates (root tooling + theme); majors get their own PRs.
  - package-ecosystem: npm
    directories: [/, /wp-content/themes/whalepress]
    schedule:
      interval: weekly
    labels: [dependencies, npm]
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]

  # One PR for Composer minor/patch updates; majors get their own PRs.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, php]
    groups:
      composer:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ['*']
