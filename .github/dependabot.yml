version: 2

# Commit prefixes decide what merging releases (docs/shipping/dependency-updates.md):
# `fix` for updates to what runs in production, so merging releases a patch;
# `chore` for tooling, CI and local-only updates, which wait for the next release.
updates:
  # One PR for all npm updates (root tooling + theme), majors included, and
  # one for all security updates.
  - package-ecosystem: npm
    directories: [/, /wp-content/themes/whalepress]
    schedule:
      interval: weekly
    labels: [dependencies, npm]
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  # One PR for all Composer updates (plugins, Timber, etc.), majors included,
  # and one for all security updates. Each is `fix` if any update in it is a
  # `require` package.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, php]
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      composer:
        patterns: ['*']
      composer-security:
        applies-to: security-updates
        patterns: ['*']

  # Base images carry WordPress core and PHP.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
