version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, npm]
    groups:
      tooling:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /wp-content/themes/whalepress
    schedule:
      interval: weekly
    labels: [dependencies, npm, theme]
    groups:
      theme:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, php]
    groups:
      php:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ['*']
