name: CI/CD

# Pull requests: quality checks and end-to-end tests against the production image.
# Pushes to main: the same, then semantic-release, then the enabled deployments.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  THEME_DIR: wp-content/themes/whalepress

jobs:
  php:
    name: PHP quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2, cs2pr

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - name: PHP_CodeSniffer
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr

      - name: PHPStan
        run: composer analyse -- --error-format=github --no-progress

      - name: Rector
        run: composer rector -- --no-progress-bar

      - name: PHPUnit
        run: composer test

  assets:
    name: Assets and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ env.THEME_DIR }}/package-lock.json

      - run: npm ci
      - run: npm ci --prefix "$THEME_DIR"

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: ESLint and Stylelint
        run: npm run lint:assets

      - name: Prettier
        run: npm run format:check

      - name: Build theme
        run: npm run build

      - name: Build docs (fails on dead links)
        run: npm run docs:build

  e2e:
    name: Image and end-to-end tests
    runs-on: ubuntu-latest
    env:
      E2E_IMAGE: whalepress:ci
      BASE_URL: http://localhost:8099
      WP_ADMIN_USER: admin
      WP_ADMIN_PASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        uses: ./.github/actions/build-image
        with:
          image: whalepress
          load: 'true'
          cache-scope: ci

      - name: Scan image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.E2E_IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Start stack
        run: docker compose -f docker-compose.test.yml up -d --no-build --wait

      - name: Install WordPress
        run: docker compose -f docker-compose.test.yml exec -T -u www-data wordpress bash -s < local/bin/install.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

      - name: Container logs
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs wordpress
          docker compose -f docker-compose.test.yml exec -T wordpress cat wp-content/debug.log || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [php, assets, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - id: release
        name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(git tag --points-at HEAD --list 'v*')
          npx semantic-release
          after=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${after#v}" >> "$GITHUB_OUTPUT"
            echo "Released $after" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No release: no releasable commits since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Deployments. GHCR is on unless the DEPLOY_GHCR variable is "false"; the
  # others are opt-in by setting DEPLOY_ECR / DEPLOY_DOCR / DEPLOY_HOSTINGER
  # to "true".
  # See docs/shipping/deployment.md for the secrets and variables each one needs.

  deploy-ghcr:
    name: Deploy (GHCR)
    needs: release
    if: needs.release.outputs.published == 'true' && vars.DEPLOY_GHCR != 'false'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-ghcr.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  deploy-ecr:
    name: Deploy (AWS)
    needs: release
    if: needs.release.outputs.published == 'true' && vars.DEPLOY_ECR == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-ecr.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  deploy-docr:
    name: Deploy (DigitalOcean)
    needs: release
    if: needs.release.outputs.published == 'true' && vars.DEPLOY_DOCR == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-docr.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  deploy-hostinger:
    name: Deploy (Hostinger)
    needs: release
    if: needs.release.outputs.published == 'true' && vars.DEPLOY_HOSTINGER == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-hostinger.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
