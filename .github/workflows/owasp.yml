name: OWASP ZAP baseline

# Passive security scan of a deployed environment. Set the HOST_URL variable on
# each GitHub environment, and optionally ZAP_AUTH_HEADER_VALUE as a secret if
# the site sits behind an auth header (e.g. a staging password).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to scan
        type: environment
        required: true

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ZAP_AUTH_HEADER_VALUE: ${{ secrets.ZAP_AUTH_HEADER_VALUE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.HOST_URL }}
          issue_title: ZAP baseline report (${{ inputs.environment }})
