name: Deploy (GHCR)

# Pushes the release image to GitHub Container Registry, then optionally calls
# a redeploy webhook (Portainer, Swarm/Shepherd, Coolify, etc.).
#
# Secrets (optional): GHCR_DEPLOY_WEBHOOK_URL, COMPOSER_AUTH
# Runs from the CI/CD pipeline after a release, or manually for any tag.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy, without the "v" (e.g. 1.4.0).
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-ghcr
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: ./.github/actions/build-image
        with:
          image: ${{ env.IMAGE }}
          version: ${{ inputs.version }}
          push: 'true'
          cache-scope: ghcr
          composer-auth: ${{ secrets.COMPOSER_AUTH }}

      - name: Trigger redeploy
        env:
          WEBHOOK_URL: ${{ secrets.GHCR_DEPLOY_WEBHOOK_URL }}
        if: env.WEBHOOK_URL != ''
        run: curl --fail --silent --show-error -X POST "$WEBHOOK_URL"

      - name: Summary
        run: |
          {
            echo "### Pushed to GHCR"
            echo '```'
            echo "${{ steps.build.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
