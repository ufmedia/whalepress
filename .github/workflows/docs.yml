name: Docs

# Builds docs/ with VitePress and publishes it to GitHub Pages.
# One-off setup: Settings → Pages → Source: "GitHub Actions". Until then the
# site is built (catching dead links) but not published.
# The base path comes from the Pages URL; DOCS_BASE (a variable) overrides it.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - package.json
      - package-lock.json
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.enabled.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # "Last updated" timestamps come from git history.

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check that Pages is enabled
        id: enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = workflow ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages isn't set to deploy from Actions (Settings → Pages → Source: GitHub Actions). Building without publishing."
          fi

      - id: pages
        if: steps.enabled.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        env:
          DOCS_BASE: ${{ vars.DOCS_BASE || (steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path)) || '/' }}
        run: npm run docs:build

      - if: steps.enabled.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
