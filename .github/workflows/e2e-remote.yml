name: E2E (deployed site)

# Runs the front-end Playwright suite against a deployed environment. Set the
# HOST_URL variable on each GitHub environment.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test
        type: environment
        required: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      BASE_URL: ${{ vars.HOST_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test --project=frontend --project=frontend-mobile

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ inputs.environment }}
          path: playwright-report/
          retention-days: 7
